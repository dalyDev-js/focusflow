<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FocusFlow</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main id="app" data-phase="focus">
    <header class="top">
      <div class="brand"><span class="logo" aria-hidden="true"></span>FocusFlow</div>
      <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.4 2.5-1a7.4 7.4 0 0 0 1.7 1l.3 2.7h4l.4-2.7a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
      </button>
    </header>

    <section id="timerView">
      <nav class="tabs" role="tablist">
        <button role="tab" data-phase="focus">Focus</button>
        <button role="tab" data-phase="short">Short break</button>
        <button role="tab" data-phase="long">Long break</button>
      </nav>

      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 220 220" aria-hidden="true">
          <circle class="track" cx="110" cy="110" r="96" />
          <circle class="progress" id="progress" cx="110" cy="110" r="96" />
        </svg>
        <div class="ring-center">
          <div class="time" id="time">25:00</div>
          <div class="label" id="phaseLabel">Focus</div>
        </div>
      </div>

      <div class="dots" id="dots" aria-label="Sessions until long break"></div>

      <div class="controls">
        <button class="icon-btn round" id="resetBtn" title="Reset" aria-label="Reset">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
        </button>
        <button class="primary" id="mainBtn">Start</button>
        <button class="icon-btn round" id="skipBtn" title="Skip to next" aria-label="Skip">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M5 5v14l9-7zm10 0h3v14h-3z"/></svg>
        </button>
      </div>

      <div class="stats">
        <div class="stat"><span id="statSessions">0</span><small>sessions today</small></div>
        <div class="stat"><span id="statMinutes">0</span><small>focus minutes</small></div>
        <div class="stat"><span id="statStreak">0</span><small>day streak</small></div>
      </div>
      <div class="goal">
        <div class="goal-bar"><div id="goalFill"></div></div>
        <small id="goalText">0 / 8 daily goal</small>
      </div>
    </section>

    <section id="settingsView" hidden>
      <h2>Settings</h2>
      <form id="settingsForm">
        <div class="grid">
          <label>Focus <span><input type="number" name="focus" min="1" max="180" /> min</span></label>
          <label>Short break <span><input type="number" name="short" min="1" max="60" /> min</span></label>
          <label>Long break <span><input type="number" name="long" min="1" max="120" /> min</span></label>
          <label>Long break every <span><input type="number" name="longEvery" min="2" max="12" /> sessions</span></label>
          <label>Daily goal <span><input type="number" name="dailyGoal" min="1" max="30" /> sessions</span></label>
        </div>
        <label class="switch"><input type="checkbox" name="autoStartBreaks" /><i></i>Auto-start breaks</label>
        <label class="switch"><input type="checkbox" name="autoStartFocus" /><i></i>Auto-start focus after a break</label>
        <label class="switch"><input type="checkbox" name="sound" /><i></i>Play a chime</label>
        <p class="hint">Shortcut: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd> starts or pauses the timer.</p>
        <div class="row">
          <button type="button" class="ghost" id="cancelSettings">Back</button>
          <button type="submit" class="primary small">Save</button>
        </div>
      </form>
    </section>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
