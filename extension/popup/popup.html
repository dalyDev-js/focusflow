<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FocusFlow</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="ambient" aria-hidden="true"><i class="blob a"></i><i class="blob b"></i><i class="blob c"></i><i class="grain"></i></div>

  <main id="app" data-phase="focus">
    <header class="top">
      <div class="brand">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" /><circle class="mark-arc" cx="12" cy="12" r="8.5" /><circle class="mark-dot" cx="12" cy="12" r="3" /></svg>
        <span>FocusFlow</span>
      </div>
      <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </header>

    <section id="timerView">
      <nav class="seg" role="tablist" aria-label="Phase">
        <span class="seg-pill" aria-hidden="true"></span>
        <button role="tab" data-phase="focus">Focus</button>
        <button role="tab" data-phase="short">Short break</button>
        <button role="tab" data-phase="long">Long break</button>
      </nav>

      <div class="dial">
        <svg class="ring" viewBox="0 0 260 260" aria-hidden="true">
          <defs>
            <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" class="g1" />
              <stop offset="1" class="g2" />
            </linearGradient>
          </defs>
          <g id="ticks"></g>
          <circle class="track" cx="130" cy="130" r="104" />
          <circle class="progress" id="progress" cx="130" cy="130" r="104" />
          <g id="head"><circle class="head-glow" cx="234" cy="130" r="10" /><circle class="head" cx="234" cy="130" r="5" /></g>
        </svg>

        <svg class="bolt" id="bolt" viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <linearGradient id="boltFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff6b0" />
              <stop offset="0.45" stop-color="#ffd83a" />
              <stop offset="1" stop-color="#ffb000" />
            </linearGradient>
          </defs>
          <g transform="rotate(28 50 50)">
            <polygon class="bolt-shadow" points="66,2 40,44 54,42 38,70 52,68 36,98 66,56 52,58 68,30 54,32" transform="translate(3 2.5)" />
            <polygon class="bolt-body" points="66,2 40,44 54,42 38,70 52,68 36,98 66,56 52,58 68,30 54,32" />
          </g>
        </svg>

        <div class="dial-center">
          <span class="phase-label"><svg class="zap-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2 4 13.5h6.5L9.5 22 20 9.5h-6.5z"/></svg><span id="phaseLabel">Focus</span></span>
          <button class="time" id="time" title="Click to edit · ↑ ↓ to adjust" aria-label="Edit time">25:00</button>
          <form class="time-edit" id="timeEdit" hidden>
            <input id="timeInput" inputmode="numeric" autocomplete="off" spellcheck="false" aria-label="Minutes (or mm:ss)" />
          </form>
          <span class="edit-hint" id="editHint">click to edit</span>
        </div>
      </div>

      <div class="slot">
        <div class="presets" id="presets" aria-label="Quick durations"></div>
        <p class="mantra" id="mantra" hidden>One thing at a time.</p>
      </div>

      <div class="controls">
        <button class="icon-btn round" id="resetBtn" title="Reset (R)" aria-label="Reset">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button class="primary" id="mainBtn">
          <svg class="i-play" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.7l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" width="18" height="18"><rect fill="currentColor" x="6" y="4" width="4.5" height="16" rx="1.5"/><rect fill="currentColor" x="13.5" y="4" width="4.5" height="16" rx="1.5"/></svg>
          <span id="mainLabel">Start</span>
        </button>
        <button class="icon-btn round" id="skipBtn" title="Skip (S)" aria-label="Skip to next phase">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5l9 7-9 7z" fill="currentColor"/><path d="M19 5v14"/></svg>
        </button>
      </div>

      <section class="today">
        <div class="today-head">
          <span>Today</span>
          <div class="dots" id="dots" title="Rounds until a long break"></div>
        </div>
        <div class="today-body">
          <div class="nums">
            <div><b id="statSessions">0</b><small>sessions</small></div>
            <div><b id="statMinutes">0</b><small>minutes</small></div>
            <div><b id="statStreak">0</b><small>day streak</small></div>
          </div>
          <div class="week" id="week" aria-label="Sessions over the last 7 days"></div>
        </div>
        <div class="goal">
          <div class="goal-bar"><div id="goalFill"></div></div>
          <small id="goalText">0 of 8</small>
        </div>
      </section>

      <footer class="keys"><kbd>Space</kbd> start · <kbd>0–9</kbd> set time · <kbd>↑</kbd><kbd>↓</kbd> ±1 min · <kbd>←</kbd><kbd>→</kbd> phase</footer>
    </section>

    <section id="settingsView" hidden>
      <div class="settings-head">
        <button class="icon-btn" id="backBtn" aria-label="Back">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <h2>Settings</h2>
      </div>
      <form id="settingsForm">
        <div class="group">
          <label>Focus <span class="num"><button type="button" data-step="-1">−</button><input type="number" name="focus" min="1" max="180" /><button type="button" data-step="1">+</button></span></label>
          <label>Short break <span class="num"><button type="button" data-step="-1">−</button><input type="number" name="short" min="1" max="60" /><button type="button" data-step="1">+</button></span></label>
          <label>Long break <span class="num"><button type="button" data-step="-1">−</button><input type="number" name="long" min="1" max="120" /><button type="button" data-step="1">+</button></span></label>
        </div>
        <div class="group">
          <label>Long break after <span class="num"><button type="button" data-step="-1">−</button><input type="number" name="longEvery" min="2" max="12" /><button type="button" data-step="1">+</button></span></label>
          <label>Daily goal <span class="num"><button type="button" data-step="-1">−</button><input type="number" name="dailyGoal" min="1" max="30" /><button type="button" data-step="1">+</button></span></label>
        </div>
        <div class="group">
          <label class="switch">Auto-start breaks<input type="checkbox" name="autoStartBreaks" /><i></i></label>
          <label class="switch">Auto-start focus<input type="checkbox" name="autoStartFocus" /><i></i></label>
          <label class="switch">Chime sound<input type="checkbox" name="sound" /><i></i></label>
        </div>
        <p class="hint"><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd> starts or pauses from any tab.</p>
        <button type="submit" class="primary wide">Save changes</button>
      </form>
    </section>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
